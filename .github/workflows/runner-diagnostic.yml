name: NaviTH - Runner Diagnostic

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test runner availability
        run: |
          echo "NaviTH GitHub Actions runner is working"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
