name: Build NaviTH Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Navigation and Marker contracts
        run: python3 tools/check_navigation_contracts.py

      - name: Verify Mapbox routing prototype contracts
        run: python3 tools/check_mapbox_contracts.py

      - name: Verify AMap-inspired NaviTH UI wiring
        run: python3 tools/check_ui_contracts.py

      - name: Verify v1.2 navigation foundation
        run: python3 tools/check_v12_navigation.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already contain Android SDK.
      # setup-android@v3 currently calls the removed 'sdkmanager tools' package
      # on this runner and fails before Gradle can start.
      - name: Use Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found at $sdk_root"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "SDK directory: $sdk_root"
          echo "Installed platforms:"
          ls -1 "$sdk_root/platforms" || true
          echo "Installed build tools:"
          ls -1 "$sdk_root/build-tools" || true
          if [[ ! -d "$sdk_root/platforms/android-35" || ! -d "$sdk_root/build-tools/35.0.0" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z "$sdkmanager_bin" ]]; then
              sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            fi
            if [[ -z "$sdkmanager_bin" ]]; then
              echo "::error::sdkmanager not found on runner"
              exit 1
            fi
            "$sdkmanager_bin" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show DEMO signing certificate SHA1
        run: keytool -list -v -keystore demo-signing/TEST_ONLY.jks -storepass android -alias demo | grep 'SHA1:'

      - name: Build debug APK
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaviTH-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
