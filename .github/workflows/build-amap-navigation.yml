name: Build NaviTH with AMAP Navigation (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-amap-navigation.yml'
      - 'app/src/main/java/com/navith/amap/NavSdkBridge.java'
      - 'app/src/main/java/com/navith/amap/MainActivity.java'
      - 'app/src/main/res/layout/activity_main.xml'
      - 'app/src/main/AndroidManifest.xml'

permissions:
  contents: read

jobs:
  android-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -d "$sdk_root/platforms/android-35" || ! -d "$sdk_root/build-tools/35.0.0" ]]; then
            sdkmanager --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify OFFICIAL combined AMAP Navigation SDK
        shell: bash
        run: |
          set -euo pipefail
          url='https://a.amap.com/lbs/static/opnavi_resources/AMap3DMap_AMapNavi_AMapSearch_AMapLocation.zip'
          curl --fail --location --show-error --silent --retry 2 --retry-delay 3 --max-time 240 "$url" -o "$RUNNER_TEMP/amap-navigation.zip"
          echo 'dedd330f7f3d916f2a9e95ad5b3cda4c' > "$RUNNER_TEMP/vendor-md5.txt"
          actual="$(md5sum "$RUNNER_TEMP/amap-navigation.zip" | cut -d ' ' -f1)"
          expected="$(cat "$RUNNER_TEMP/vendor-md5.txt")"
          echo "AMAP SDK MD5: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Vendor archive does not match published AMAP Global Navigation 11.2.1001 MD5. Aborting."
            exit 1
          fi
          unzip -tq "$RUNNER_TEMP/amap-navigation.zip"

      - name: Replace Map-only SDK with combined Map+Navigation+Search+Location
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,shutil
          source=os.path.join(os.environ['RUNNER_TEMP'],'amap-navigation.zip')
          jar_target='app/libs/amap-combined-20260805.jar'
          natives_target='app/libs/amap-native-android.zip'
          with zipfile.ZipFile(source) as z:
              jars=[name for name in z.namelist() if name.lower().endswith('.jar')]
              if len(jars)!=1:raise SystemExit('Unexpected vendor SDK JAR list: '+str(jars))
              with zipfile.ZipFile(z.open(jars[0])) as jar:
                  classes=jar.namelist()
                  required=('com/amap/api/navi/AMapNavi.class',
                            'com/amap/api/navi/AmapNaviPage.class',
                            'com/amap/api/maps/MapView.class',
                            'com/amap/api/services/poisearch/PoiSearch.class')
                  absent=[a for a in required if a not in classes]
                  if absent:raise SystemExit('Navigation SDK missing classes: '+str(absent))
              with z.open(jars[0]) as inp,open(jar_target,'wb') as out:
                  shutil.copyfileobj(inp,out)
              libs=[a for a in z.namelist() if a.endswith('.so') and
                    a.startswith(('arm64-v8a/','armeabi-v7a/'))]
              if len(libs)<8:raise SystemExit('Too few official native libraries: '+str(libs))
              with zipfile.ZipFile(natives_target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=3) as out:
                  for name in libs:
                      with z.open(name) as inp:
                          out.writestr(name,inp.read())
              print('Combined Navigation JAR:',jars[0],os.path.getsize(jar_target))
              print('Native libraries:',libs)
              print('All prior stand-alone AMAP binaries replaced: YES')
          PY

      - name: Check local demo signing certificate
        shell: bash
        run: |
          keytool -list -v -keystore demo-signing/TEST_ONLY.jks -storepass android -alias demo | grep 'SHA1:'

      - name: Compile Navigation-enabled APK
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          if [[ -z "$AMAP_KEY" ]]; then
            echo "::error::Missing repository Actions secret AMAP_KEY"
            exit 1
          fi
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload experimental NaviTH Navigation APK
        uses: actions/upload-artifact@v4
        with:
          name: NaviTH-Navigation-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
