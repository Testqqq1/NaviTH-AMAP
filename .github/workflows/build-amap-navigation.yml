name: Build NaviTH with AMAP Navigation (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-amap-navigation.yml'
      - 'app/src/main/java/com/navith/amap/NavSdkBridge.java'
      - 'app/src/main/java/com/navith/amap/NavigationMarkerFactory.java'
      - 'tools/check_navigation_contracts.py'
      - 'app/src/main/java/com/navith/amap/MainActivity.java'
      - 'app/src/main/res/layout/activity_main.xml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/src/main/java/com/navith/amap/car/**'
      - 'app/src/test/**'
      - 'app/src/main/java/com/navith/amap/McpPlacesClient.java'
      - 'app/src/main/java/com/navith/amap/SettingsActivity.java'
      - 'app/src/main/res/values/**'
      - 'app/src/main/res/values-night/**'
      - 'app/src/main/res/values-en/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/main/java/com/navith/amap/NaviLocale.java'

permissions:
  contents: read

jobs:
  android-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Navigation and Marker contracts
        run: python3 tools/check_navigation_contracts.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -d "$sdk_root/platforms/android-35" || ! -d "$sdk_root/build-tools/35.0.0" ]]; then
            sdkmanager --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified official AMAP SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/amap-navigation.zip
          key: amap-global-nav-11.2.1001-dedd330f7f3d916f2a9e95ad5b3cda4c

      - name: Download and verify OFFICIAL combined AMAP Navigation SDK
        shell: bash
        run: |
          set -euo pipefail
          url='https://a.amap.com/lbs/static/opnavi_resources/AMap3DMap_AMapNavi_AMapSearch_AMapLocation.zip'
          archive="$RUNNER_TEMP/amap-navigation.zip"
          expected='dedd330f7f3d916f2a9e95ad5b3cda4c'
          actual=""
          if [[ -f "$archive" ]]; then
            actual="$(md5sum "$archive" | cut -d ' ' -f1)"
          fi
          if [[ "$actual" != "$expected" ]]; then
            # AMap's ~93 MB vendor CDN is frequently slower than 240s on
            # GitHub-hosted runners. Preserve partial bytes for HTTP resume
            # instead of restarting from zero on every curl timeout.
            rm -f "$archive"
            downloaded=0
            for attempt in 1 2 3 4 5; do
              echo "Official AMAP SDK fetch attempt $attempt; resume at $(stat -c%s "$archive" 2>/dev/null || echo 0) bytes"
              set +e
              curl -fLsS --connect-timeout 40 --max-time 360 \
                --retry 0 --continue-at - "$url" -o "$archive"
              result=$?
              set -e
              if [[ "$result" -eq 0 ]]; then downloaded=1;break;fi
              if [[ "$result" -eq 33 ]]; then
                # Server ignored Range: one longer uninterrupted transfer.
                rm -f "$archive"
                curl -fLsS --connect-timeout 40 --max-time 1200 "$url" -o "$archive"
                downloaded=1
                break
              fi
              sleep 4
            done
            if [[ "$downloaded" -ne 1 ]]; then
              echo "::error::Could not download official AMAP Navigation SDK (vendor CDN slow/unavailable)"
              exit 1
            fi
          fi
          actual="$(md5sum "$archive" | cut -d ' ' -f1)"
          echo "Official AMAP SDK archive MD5: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Vendor archive checksum differs from official 11.2.1001 MD5; refusing unsafe SDK"
            exit 1
          fi
          unzip -tq "$archive"

      - name: Replace Map-only SDK with combined Map+Navigation+Search+Location
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,shutil
          source=os.path.join(os.environ['RUNNER_TEMP'],'amap-navigation.zip')
          jar_target='app/libs/amap-combined-20260805.jar'
          natives_target='app/libs/amap-native-android.zip'
          with zipfile.ZipFile(source) as z:
              jars=[name for name in z.namelist() if name.lower().endswith('.jar')]
              if len(jars)!=1:raise SystemExit('Unexpected vendor SDK JAR list: '+str(jars))
              with zipfile.ZipFile(z.open(jars[0])) as jar:
                  classes=jar.namelist()
                  required=('com/amap/api/navi/AMapNavi.class',
                            'com/amap/api/navi/AmapNaviPage.class',
                            'com/amap/api/maps/MapView.class',
                            'com/amap/api/services/poisearch/PoiSearch.class')
                  absent=[a for a in required if a not in classes]
                  if absent:raise SystemExit('Navigation SDK missing classes: '+str(absent))
              with z.open(jars[0]) as inp,open(jar_target,'wb') as out:
                  shutil.copyfileobj(inp,out)
              libs=[a for a in z.namelist() if a.endswith('.so') and
                    a.startswith(('arm64-v8a/','armeabi-v7a/'))]
              if len(libs)<8:raise SystemExit('Too few official native libraries: '+str(libs))
              with zipfile.ZipFile(natives_target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=3) as out:
                  for name in libs:
                      with z.open(name) as inp:
                          out.writestr(name,inp.read())
              print('Combined Navigation JAR:',jars[0],os.path.getsize(jar_target))
              print('Native libraries:',libs)
              print('All prior stand-alone AMAP binaries replaced: YES')
          PY

      - name: Verify Navigation runtime contract in bundled SDK
        shell: bash
        run: |
          set -euo pipefail
          jar='app/libs/amap-combined-20260805.jar'
          test -s "$jar"
          # Compile success does not detect reflection mistakes. Fail this test
          # if required runtime component APIs are absent in the official JAR.
          javap -classpath "$jar" com.amap.api.navi.AmapPageType > "$RUNNER_TEMP/page-type.txt"
          javap -classpath "$jar" com.amap.api.navi.AmapNaviPage > "$RUNNER_TEMP/page.txt"
          javap -classpath "$jar" com.amap.api.navi.AmapNaviParams > "$RUNNER_TEMP/params.txt"
          javap -classpath "$jar" com.amap.api.navi.NaviSetting > "$RUNNER_TEMP/privacy.txt"
          javap -classpath "$jar" com.amap.api.navi.AMapNavi > "$RUNNER_TEMP/engine.txt"
          javap -classpath "$jar" com.amap.api.maps.model.Poi > "$RUNNER_TEMP/poi.txt"
          javap -classpath "$jar" com.amap.api.navi.AMapNaviListener > "$RUNNER_TEMP/listener.txt"
          grep -qE 'AmapPageType NAVI;' "$RUNNER_TEMP/page-type.txt"
          grep -q 'showRouteActivity(' "$RUNNER_TEMP/page.txt"
          grep -q 'exitRouteActivity(' "$RUNNER_TEMP/page.txt"
          grep -q 'updatePrivacyShow(' "$RUNNER_TEMP/privacy.txt"
          grep -q 'updatePrivacyAgree(' "$RUNNER_TEMP/privacy.txt"
          grep -q 'addAMapNaviListener(' "$RUNNER_TEMP/engine.txt"
          grep -q 'onNaviInfoUpdate(' "$RUNNER_TEMP/listener.txt"
          grep -q 'onStartNavi(' "$RUNNER_TEMP/listener.txt"
          grep -q 'onArriveDestination(' "$RUNNER_TEMP/listener.txt"
          grep -q 'onReCalculateRouteForYaw(' "$RUNNER_TEMP/listener.txt"
          javap -classpath "$jar" com.amap.api.navi.model.NaviInfo > "$RUNNER_TEMP/navi-info.txt"
          javap -classpath "$jar" com.amap.api.navi.model.AMapLaneInfo > "$RUNNER_TEMP/lane-info.txt"
          javap -classpath "$jar" com.amap.api.navi.model.AMapExitDirectionInfo > "$RUNNER_TEMP/exit-info.txt"
          javap -classpath "$jar" com.amap.api.navi.enums.IconType > "$RUNNER_TEMP/icon-type.txt"
          grep -q 'getIconType(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'getNextRoadName(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'getCurStepRetainDistance(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'getPathRetainDistance(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'getPathRetainTime(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'getExitDirectionInfo(' "$RUNNER_TEMP/navi-info.txt"
          grep -q 'showLaneInfo(' "$RUNNER_TEMP/listener.txt"
          grep -q 'hideLaneInfo(' "$RUNNER_TEMP/listener.txt"
          grep -q 'backgroundLane' "$RUNNER_TEMP/lane-info.txt"
          grep -q 'frontLane' "$RUNNER_TEMP/lane-info.txt"
          grep -q 'laneCount' "$RUNNER_TEMP/lane-info.txt"
          grep -q 'getExitNameInfo(' "$RUNNER_TEMP/exit-info.txt"
          grep -q 'getDirectionInfo(' "$RUNNER_TEMP/exit-info.txt"
          grep -q 'int LEFT;' "$RUNNER_TEMP/icon-type.txt"
          grep -q 'int ENTER_ROUNDABOUT;' "$RUNNER_TEMP/icon-type.txt"
          grep -q 'int MERGE_LEFT;' "$RUNNER_TEMP/icon-type.txt"
          echo 'Navigation component, privacy, GPS callbacks, icon type and lane APIs verified'

      - name: Check local demo signing certificate
        shell: bash
        run: |
          keytool -list -v -keystore demo-signing/TEST_ONLY.jks -storepass android -alias demo | grep 'SHA1:'

      - name: Compile Navigation-enabled APK
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          if [[ -z "$AMAP_KEY" ]]; then
            echo "::error::Missing repository Actions secret AMAP_KEY"
            exit 1
          fi
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload experimental NaviTH Navigation APK
        uses: actions/upload-artifact@v4
        with:
          name: NaviTH-Navigation-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
