name: Verify Opnavi Web Service integration (offline)
on:
  push:
    branches: [main]
    paths:
      - 'integrations/opnavi-webservice/**'
      - 'integrations/mcp-bridge/server.mjs'
      - '.github/workflows/opnavi-webservice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mocked Web Service contract tests
        run: node --test integrations/opnavi-webservice/client.test.mjs
      - name: Verify bridge syntax
        run: node --check integrations/mcp-bridge/server.mjs
