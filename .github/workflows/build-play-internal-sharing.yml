name: Build NaviTH for Play Internal App Sharing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-sharing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout NaviTH
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then echo "::error::Android SDK missing"; exit 1; fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -d "$sdk_root/platforms/android-35" || ! -d "$sdk_root/build-tools/35.0.0" ]]; then
            sdkmanager --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Play signing AMAP credential is configured
        shell: bash
        env:
          AMAP_KEY_PLAY: ${{ secrets.AMAP_KEY_PLAY }}
        run: |
          if [[ -z "$AMAP_KEY_PLAY" ]]; then
            echo "::error::Create AMAP_KEY_PLAY repository secret bound to the Internal App Sharing SHA-1 and com.navith.amap"
            exit 1
          fi
          if [[ "$AMAP_KEY_PLAY" == "YOUR_AMAP_KEY" ]]; then
            echo "::error::Placeholder AMAP key not permitted"
            exit 1
          fi
          echo 'Play Internal Sharing AMAP Key is configured (contents hidden).'

      - name: Build debug APK for Play Internal App Sharing
        shell: bash
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY_PLAY }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK to GitHub Actions only (NO Play publication)
        uses: actions/upload-artifact@v4
        with:
          name: NaviTH-Play-Internal-Sharing-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
