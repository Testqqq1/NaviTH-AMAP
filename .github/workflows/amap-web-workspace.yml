name: Prepare NaviTH map reference workspace

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitmodules'
      - 'third_party/amap-web/**'
      - 'third_party/flutter/**'
      - 'third_party/mcp/**'
      - 'tools/install-amap-web.sh'
      - 'tools/install-map-references.sh'
      - '.github/workflows/amap-web-workspace.yml'

permissions:
  contents: read

jobs:
  source-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out NaviTH and pinned reference submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify all expected AMap-Web repositories
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            amap-skills amap-lbs-skill amap-screenshot layer-3dtiles
            amap-jsapi-types amap-three amap-map-agent-skills
            RealMapBench amap-loca-types
          )
          mkdir -p dist
          for name in "${expected[@]}"; do
            folder="third_party/amap-web/$name"
            test -d "$folder" || { echo "::error::Missing submodule $name"; exit 1; }
            test -n "$(find "$folder" -mindepth 1 -maxdepth 2 -print -quit)" ||
              { echo "::error::Empty checkout $name"; exit 1; }
            echo "$name $(git -C "$folder" rev-parse HEAD) https://github.com/AMap-Web/$name" |
              tee -a dist/AMap-Web-commits.txt
          done
          printf '%s\n' 'amap-loca-types- NO_COMMITS https://github.com/AMap-Web/amap-loca-types-' |
            tee -a dist/AMap-Web-commits.txt
          cp third_party/amap-web/README.md dist/AMap-Web-README.md
      - name: Verify Flutter AMap reference repository
        shell: bash
        run: |
          set -euo pipefail
          folder='third_party/flutter/flutter_amap'
          test -f "$folder/pubspec.yaml"
          test -f "$folder/README.md"
          echo "best-flutter/flutter_amap $(git -C "$folder" rev-parse HEAD) https://github.com/best-flutter/flutter_amap" | tee -a dist/Reference-commits.txt
          cp third_party/flutter/README.md dist/Flutter-README.md
      - name: Verify MCP map server reference source (no package install)
        shell: bash
        run: |
          set -euo pipefail
          folder='third_party/mcp/amap-maps-mcp-server'
          test -f "$folder/package.json"
          test -f "$folder/README.md"
          test -f "$folder/LICENSE"
          node -e 'const p=require("./third_party/mcp/amap-maps-mcp-server/package.json");if(p.name!=="@masx200/amap-maps-mcp-server")process.exit(1);console.log("Verified:",p.name,p.version)'
          echo "masx200/amap-maps-mcp-server $(git -C "$folder" rev-parse HEAD) https://github.com/masx200/amap-maps-mcp-server" | tee -a dist/Reference-commits.txt
          cp third_party/mcp/README.md dist/MCP-README.md
      - name: Package 11 source repositories without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          cp dist/AMap-Web-commits.txt dist/AMap-Web-source-commits.txt
          cat dist/AMap-Web-commits.txt >> dist/Reference-commits.txt
          tar --exclude='*/.git' -czf dist/NaviTH-11-reference-repositories.tar.gz third_party/amap-web third_party/flutter third_party/mcp
          ls -lh dist/
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NaviTH-map-reference-sources
          path: dist/
          if-no-files-found: error
          retention-days: 14
